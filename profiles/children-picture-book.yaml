version: 0.5.0
id: children_picture_book
name: Children's Picture Book
purpose: Create an age-specific read-aloud story with emotional and causal clarity.
default_prose_mode: read_aloud_narrative
required_inputs:
- age_range
- story_promise
structure:
  headings: title only
  bullets: forbidden
  numbered_steps: forbidden
  short_paragraphs: permitted
  repeated_refrain: preferred
  read_aloud_rhythm: required
quality_gate: quality/profile-gates/children.md
