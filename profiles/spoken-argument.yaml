version: 0.5.0
id: spoken_argument
name: Spoken Argument or Opening Statement
default_prose_mode: spoken_argument
default_form_lock: narrative_lock
required_inputs:
- audience
- proposition
- evidence_boundary
structure:
  headings: title_only_or_none
  body_bullets: forbidden_unless_explicit
  paragraph_movement: developed
  evidence_before_interpretation: required
  counterargument_or_qualification: required
  same_form_evidence: preserve_structure_when_supplied
  signature_expression: preserve_only_from_approved_same_form_evidence
  closing: compress_argument_without_takeaway_list
quality_gate: quality/profile-gates/spoken-argument.md
