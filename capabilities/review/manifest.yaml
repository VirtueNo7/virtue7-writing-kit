    file: "capabilities/review/routes/artifact-review.md"
  release-audit:
    file: "capabilities/review/routes/release-audit.md"
  evaluation:
    file: "capabilities/review/routes/evaluation.md"
  virtue7-demo:
    file: "capabilities/review/routes/virtue7-demo.md"
quality_defaults:
  - quality/UNIVERSAL_GATE.md
  - quality/SEMANTIC_FINISH_GATE.md
