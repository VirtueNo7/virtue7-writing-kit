kit:
  name: "Virtue7 Writing Kit"
  version: "0.2.0"
  mode: "guided"
  model_neutral: true
  entrypoint: "00_START_HERE.md"

publisher:
  display_name: "Virtue7"
  include_in_generated_books: false

output_defaults:
  white_label: true
  attribution: false
  language: "Ask the user"
  locale: "Ask or infer only with permission"
  spelling: "Follow selected locale"
  canonical_format: "Markdown with YAML front matter"
  approval_required: true

interaction:
  questions_per_turn: 1
  use_reversible_defaults: true
  show_internal_architecture: false
  maintain_session_state: true

research:
  browsing_default: "ask"
  nonfiction_invention: "prohibited"
  fictional_invention: "allowed only when the project is explicitly fictional"
  quotations: "exact wording and source required"
  uncertainty: "preserve"

reference_grounding:
  enabled: true
  classify_before_use: true
  minimum_relevant_packet: true
  whole_archive_blending: false
  promote_only_approved_prose: true
  provenance_level: "unit by default; passage when risk or complexity requires"

voice:
  contract_required_when_preserving_existing_voice: true
  evidence_backed_rules: true
  named_author_imitation: false
  project_native_canon: true

demo:
  subject: "Elias Vale"
  occupation: "Master Builder"
  fictional: true
  external_research: false
