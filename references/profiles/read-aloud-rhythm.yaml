id: read_aloud_rhythm
reference_role: cadence
observations:
  - simple vocabulary with precise sound
  - repetition that invites participation
  - varied short sentence patterns
  - concrete action and playful verbal movement
  - a close that resolves the story's own pattern
boundary: "Use general read-aloud mechanisms. Do not reproduce signature creatures, invented vocabulary, recognisable phrasing, or a source-specific rhyme system."
