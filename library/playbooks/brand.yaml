pack: brand
version: 0.5.0
playbooks:
  - id: positioning-core
    title: Build the Positioning Core
    starter: "Turn these customer, category, product, and competitor inputs into a defensible positioning core."
    outcome: precise audience, problem, promise, proof, difference, and boundaries
    route: writing/new-output
    profile: brand_strategy
    inputs: [customer evidence, category, offer, alternatives]
    outputs: [positioning core, proof map, prohibited claims, open questions]
    gates: [evidence, semantic_finish, approval]
    tool_contract: "Native for supplied inputs; current competitor research requires live tools."
  - id: voice-system
    title: Build a Brand Voice System
    starter: "Learn the recurring choices in these approved materials and create usable voice rules with positive and negative examples."
    outcome: evidence-backed voice contract that guides without cloning an individual
    route: personalization/learn-cadence
    inputs: [authorized brand corpus, audiences, channels]
    outputs: [voice contract, cadence profile, do-and-don't examples]
    gates: [authorization, cadence_fidelity, privacy]
    tool_contract: native
  - id: campaign-architecture
    title: Build a Campaign
    starter: "Build one campaign idea that can survive across channels without turning into repeated generic copy."
    outcome: campaign kernel with channel-specific expressions and proof discipline
    route: content-creator/campaign
    profile: social_content_package
    inputs: [positioning core, campaign objective, audiences, channels]
    outputs: [campaign kernel, asset matrix, copy drafts, approval map]
    gates: [claim_consistency, cadence_fidelity, approval]
    tool_contract: "Native for development; design, publishing, and measurement require external tools."
  - id: claim-audit
    title: Audit Brand Claims
    starter: "Test every public claim in this copy against the supplied proof and mark unsupported, ambiguous, regulated, or approved language."
    outcome: safer public copy with a reusable claim register
    route: review/release-audit
    inputs: [copy, substantiation, market or jurisdiction, approval policy]
    outputs: [claim register, risk notes, revision options]
    gates: [evidence, publication_risk, approval]
    tool_contract: "Native for supplied proof; current regulatory verification requires live authoritative sources and qualified review."
