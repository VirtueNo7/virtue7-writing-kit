bundle:
  name: Virtue7 Writing Kit
  version: 0.5.0
  runtime: compiled-capability-lazy
  entrypoint: 00_START_HERE.md
  white_label_outputs: true
boot:
  maximum_files: 3
  maximum_bytes: 13000
  files:
  - 00_START_HERE.md
  - RUNTIME_MANIFEST.yaml
  - MASTER_PROMPT.md
  activation:
    no_substantive_task: show_exact_start_menu
    boot_only_request: show_exact_start_menu
    substantive_direct_task: skip_menu
    preamble: forbidden_before_start_menu
    menu_source: 00_START_HERE.md#Start
modes:
  chat:
    lifespan: conversational
  content:
    lifespan: bounded_artifact
  automation:
    lifespan: bounded_task
    packet: runtime/packets/modes/automation.md
canonical:
  taxonomy: config/taxonomy.yaml
  gates: config/gates.yaml
  profiles: config/output-profiles.yaml
  form_lock: config/form-lock.yaml
  packet_index: runtime/packet-index.yaml
  schemas:
    artifact: schemas/artifact-record.schema.json
    approval: schemas/approval-record.schema.json
    tool_receipt: schemas/tool-receipt.schema.json
    extension: schemas/extension-manifest.schema.json
capabilities:
  personalization:
    label: Make it mine
    manifest: capabilities/personalization/manifest.yaml
    routes:
      initialize: runtime/packets/routes/personalization--initialize.md
      learn-cadence: runtime/packets/routes/personalization--learn-cadence.md
      manage-profile: runtime/packets/routes/personalization--manage-profile.md
      switch-scope: runtime/packets/routes/personalization--switch-scope.md
      create-command: runtime/packets/routes/personalization--create-command.md
  writing:
    label: Write
    manifest: capabilities/writing/manifest.yaml
    routes:
      freestyle: runtime/packets/routes/writing--freestyle.md
      new-output: runtime/packets/routes/writing--new-output.md
      revise-output: runtime/packets/routes/writing--revise-output.md
      expand-collapse: runtime/packets/routes/writing--expand-collapse.md
  content_creator:
    label: Create
    manifest: capabilities/content-creator/manifest.yaml
    routes:
      original-content: runtime/packets/routes/content-creator--original-content.md
      episode-video-newsletter: runtime/packets/routes/content-creator--episode-video-newsletter.md
      repurpose: runtime/packets/routes/content-creator--repurpose.md
      clips: runtime/packets/routes/content-creator--clips.md
      interview: runtime/packets/routes/content-creator--interview.md
      campaign: runtime/packets/routes/content-creator--campaign.md
  research:
    label: Research
    manifest: capabilities/research/manifest.yaml
    routes:
      research-question: runtime/packets/routes/research--research-question.md
      source-review: runtime/packets/routes/research--source-review.md
      evidence-brief: runtime/packets/routes/research--evidence-brief.md
  resume:
    label: Career materials
    manifest: capabilities/resume/manifest.yaml
    routes:
      build-source: runtime/packets/routes/resume--build-source.md
      tailor-resume: runtime/packets/routes/resume--tailor-resume.md
      cover-letter: runtime/packets/routes/resume--cover-letter.md
  job_search:
    label: Job search
    manifest: capabilities/job-search/manifest.yaml
    routes:
      search: runtime/packets/routes/job-search--search.md
      evaluate: runtime/packets/routes/job-search--evaluate.md
      handoff: runtime/packets/routes/job-search--handoff.md
  legal:
    label: Legal preparation
    manifest: capabilities/legal/manifest.yaml
    routes:
      resolve-jurisdiction: runtime/packets/routes/legal--resolve-jurisdiction.md
      legal-research: runtime/packets/routes/legal--legal-research.md
      prepare-document: runtime/packets/routes/legal--prepare-document.md
      review-document: runtime/packets/routes/legal--review-document.md
  continuation:
    label: Continue
    manifest: capabilities/continuation/manifest.yaml
    routes:
      load-state: runtime/packets/routes/continuation--load-state.md
      next-gate: runtime/packets/routes/continuation--next-gate.md
      controlled-update: runtime/packets/routes/continuation--controlled-update.md
  review:
    label: Review
    manifest: capabilities/review/manifest.yaml
    routes:
      artifact-review: runtime/packets/routes/review--artifact-review.md
      release-audit: runtime/packets/routes/review--release-audit.md
      evaluation: runtime/packets/routes/review--evaluation.md
      virtue7-demo: runtime/packets/routes/review--virtue7-demo.md
profile_packets:
  directory: runtime/packets/profiles
  naming: <profile-id>.md
playbook_library:
  manifest: library/manifest.yaml
  index: library/index.yaml
  activation: load only after the desired outcome is known
supporting_profiles:
  personal: templates/personal-work-profile.md
  role: templates/role-profile.md
  organization: templates/organization-profile.md
  client: templates/client-profile.md
  project: templates/project-state.md
  channel: templates/channel-profile.md
loading_rules:
  maximum_active_mode_packets: 1
  maximum_active_capabilities: 1
  maximum_active_routes: 1
  maximum_active_profiles: 1
  maximum_supporting_context_packets: 1
  direct_task_skips_menu: true
  maximum_material_questions: 1
  instructions:
  - Classify mode first; Chat and ordinary Content need no mode packet.
  - Load one compiled route packet and a profile only when the current step needs
    them.
  - Pass compact handoffs when capabilities change; unload completed-step packets.
  boot_only_request_is_direct_task: false
never_preload:
- examples
- references
- tests
- scripts
- docs
- demo
- release_history
